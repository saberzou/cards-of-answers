<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cards of Answers</title>
  <meta name="description" content="Hold your question. Draw one illustrated card from the deck and keep the answer.">
  <meta name="theme-color" content="#241428">
  <link rel="canonical" href="https://saberzou.github.io/cards-of-answers/">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta property="og:title" content="Cards of Answers">
  <meta property="og:description" content="Hold your question. Draw one illustrated card and keep the answer.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://saberzou.github.io/cards-of-answers/">
  <meta property="og:image" content="https://saberzou.github.io/cards-of-answers/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Cards of Answers">
  <meta name="twitter:description" content="Hold your question. Draw one illustrated card and keep the answer.">
  <meta name="twitter:image" content="https://saberzou.github.io/cards-of-answers/og.png">
  <link rel="preload" href="fonts/anybody.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/petrona.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-mode="rest">
  <main class="theater">
    <p class="wordmark">Cards of Answers</p>
    <div class="stage" id="stage">
      <div class="curtain" aria-hidden="true">
        <div class="curtain-panel left"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
        <div class="curtain-panel right"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
      </div>
      <div class="company" id="company"></div>
      <button class="hold" id="hold" type="button" aria-labelledby="apron-title" aria-describedby="hold-help" aria-pressed="false"></button>
      <article class="reading" id="reading" hidden>
        <div class="reading-art">
          <img id="reading-img" alt="" width="300" height="420" src="images/card-love.webp">
        </div>
        <div class="reading-copy" id="reading-copy">
          <p class="reading-cat" id="reading-cat"></p>
          <p class="reading-note" id="reading-note" hidden></p>
        </div>
      </article>
    </div>
    <div class="apron">
      <div id="title-slot">
        <h1 class="apron-title" id="apron-title">Hold your question.</h1>
      </div>
      <p class="hint" id="hint">Press and hold the deck for one breath.</p>
      <p class="sr" id="hold-help">Press and hold for about one breath. Release when the lamps are lit and the stage says Release.</p>
      <div class="lamps" id="lamps" aria-hidden="true"></div>
      <div class="actions" id="actions" hidden>
        <button type="button" id="keep">Keep this card</button>
        <button type="button" class="quiet" id="link">Copy link</button>
        <button type="button" class="quiet" id="back">Back to the deck</button>
        <button type="button" class="quiet" id="again">Ask again</button>
      </div>
      <p class="status" id="status" role="status"></p>
      <button class="today" id="today" type="button">Today’s card</button>
    </div>
  </main>
  <p class="sr" id="live" aria-live="polite"></p>
  <noscript class="noscript">Cards of Answers needs JavaScript to deal the deck. Each of the twenty-four cards holds ten answers.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
